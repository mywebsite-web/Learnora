    <script>
      // Ignore benign development notices and offline firestore notices per environment constraints
      (function() {
        const suppress = (msg) => typeof msg === 'string' && (
          msg.includes('[vite]') || 
          msg.toLowerCase().includes('websocket') ||
          msg.includes('Could not reach Cloud Firestore backend') ||
          msg.includes('client will operate in offline mode')
        );
        const origError = console.error;
        console.error = function(...args) {
          if (args.some(suppress)) return;
          origError.apply(console, args);
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(suppress)) return;
          origWarn.apply(console, args);
        };
      })();
    </script>
